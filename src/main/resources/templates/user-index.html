<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Formの練習画面</h2>
    <form th:action="@{/user-submit}" th:object="${userForm}" method="post">
        <label for="userName">お名前:</label>
        <input type="text" id="userName" th:field="*{userName}" />
        <label for="age">年齢:</label>
        <input type="number" id="age" th:field="*{age}" />
        <button type="submit">送信</button>
        <div th:if="${#fields.hasErrors()}">
            <p th:errors="*{userName}" style="color: red;" font-weight="bold"></p>
            <p th:errors="*{age}" style="color: red;" font-weight="bold"></p>
        </div>
    </form>
    
    <hr>

    <div th:if="${message}">
        <p th:text="${message}"
            th:style="${age >= 20 ? 'color: blue;' : 'color: red;'}" font-weight="bold"></p>
    </div>

    <h3>ユーザー一覧</h3>
    <ul>
        <li th:each="user : ${userList}">
            <span th:text="${user.userName}"></span> - <span th:text="${user.age}"></span>歳
        </li>
    </ul>
</body>
</html>
